# Proyecto dbt de Little Lemon: transforma raw (PostgreSQL) en staging y marts.
name: little_lemon
version: "1.0.0"
profile: little_lemon
require-dbt-version: [">=1.10.0", "<3.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

flags:
  # dbt envía estadísticas de uso anónimas por defecto: se desactivan.
  send_anonymous_usage_stats: false

models:
  little_lemon:
    staging:
      # Una tabla por tabla de raw: versión vigente, nombres en snake_case.
      # Tablas y no vistas: se deduplica una vez por build (ADR-008).
      +schema: staging
      +materialized: table
      +post-hook: "analyze {{ this }}"
    intermediate:
      # Lógica reutilizable entre staging y marts (versiones SCD2, estado de pedidos).
      +schema: intermediate
      +materialized: table
      +post-hook: "analyze {{ this }}"
    marts:
      # Estrella para el negocio: se calcula una vez por dbt build.
      # ANALYZE al crear cada tabla: si no, quedan sin estadísticas (ADR-008).
      +schema: marts
      +materialized: table
      +post-hook: "analyze {{ this }}"
