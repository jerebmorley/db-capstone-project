# MySQL de Little Lemon (OLTP) cargado con schema y datos, PostgreSQL (warehouse)
# y, en el profile "airflow", el orquestador.
# Uso: cp .env.example .env  →  completar  →  docker compose up -d
#      Airflow:  docker compose --profile airflow up -d --build
#      Dashboard: docker compose --profile dashboard up -d --build

# Configuración común de los servicios de Airflow (ver docs/adr/007).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: little-lemon-airflow:3.4.0
  profiles: ["airflow"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD:?Falta AIRFLOW_DB_PASSWORD en .env}@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Falta AIRFLOW_JWT_SECRET en .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Variables del pipeline, una por una (no todo el .env). Dentro de la red de
    # Docker las bases se llaman por el nombre del servicio, en su puerto interno.
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: ${DB_NAME}
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DB: ${PG_DB}
    PG_USER: ${PG_USER}
    PG_PASSWORD: ${PG_PASSWORD}
  volumes:
    # Código en solo lectura: Airflow no escribe archivos en el repo.
    - ./dags:/opt/airflow/dags:ro
    - ./scripts:/opt/little_lemon/scripts:ro
    - ./dbt:/opt/little_lemon/dbt:ro
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-depends-on
    airflow-db:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    # Vuelve solo si se reinicia Docker o la máquina (no si lo frenás vos).
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:?Falta DB_NAME en .env}
      MYSQL_USER: ${DB_USER:?Falta DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      # Solo accesible desde esta máquina. 3307 para no chocar con un MySQL local.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/seed:ro
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la carga inicial MySQL no escucha en red, así que
      # el contenedor recién queda "healthy" cuando terminó de cargar.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    # Warehouse analítico: schemas raw (extractor) y, más adelante, dbt.
    image: postgres:18
    # Vuelve solo si se reinicia Docker o la máquina (no si lo frenás vos).
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:?Falta PG_DB en .env}
      POSTGRES_USER: ${PG_USER:?Falta PG_USER en .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Falta PG_PASSWORD en .env}
    ports:
      # 5434 para no chocar con otros PostgreSQL locales (5432, 5433).
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    volumes:
      # Desde la imagen 18 los datos van en /var/lib/postgresql/18/docker:
      # se monta el directorio padre, no el viejo /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización solo escucha por socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  airflow-db:
    # Metadatos de Airflow (DAGs, corridas, usuarios), separados del warehouse.
    image: postgres:18
    profiles: ["airflow"]
    # Vuelve solo si se reinicia Docker o la máquina (no si lo frenás vos).
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Falta AIRFLOW_DB_PASSWORD en .env}
    volumes:
      - airflow_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 30

  airflow-init:
    # Corre una vez: migra la base de metadatos y crea el usuario de la web.
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?Falta AIRFLOW_ADMIN_USER en .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Falta AIRFLOW_ADMIN_PASSWORD en .env}

  airflow-apiserver:
    # Interfaz web y API.
    <<: *airflow-common
    command: api-server
    # Vuelve solo si se reinicia Docker o la máquina (no si lo frenás vos).
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    # Decide qué correr y, con LocalExecutor, ejecuta las tareas él mismo.
    <<: *airflow-common
    command: scheduler
    # Vuelve solo si se reinicia Docker o la máquina (no si lo frenás vos).
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-dag-processor:
    # Lee y valida los archivos de dags/.
    <<: *airflow-common
    command: dag-processor
    # Vuelve solo si se reinicia Docker o la máquina (no si lo frenás vos).
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    # Dashboard de Streamlit: solo lee el schema marts del warehouse.
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: little-lemon-dashboard:1.0
    profiles: ["dashboard"]
    # Vuelve solo si se reinicia Docker o la máquina (no si lo frenás vos).
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mysql_data:
  postgres_data:
  airflow_db_data:
  airflow_logs:
