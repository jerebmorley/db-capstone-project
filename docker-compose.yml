# MySQL de Little Lemon (OLTP) cargado con schema y datos, y PostgreSQL (warehouse).
# Uso: cp .env.example .env  →  completar  →  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:?Falta DB_NAME en .env}
      MYSQL_USER: ${DB_USER:?Falta DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      # Solo accesible desde esta máquina. 3307 para no chocar con un MySQL local.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/seed:ro
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la carga inicial MySQL no escucha en red, así que
      # el contenedor recién queda "healthy" cuando terminó de cargar.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    # Warehouse analítico: schemas raw (extractor) y, más adelante, dbt.
    image: postgres:18
    environment:
      POSTGRES_DB: ${PG_DB:?Falta PG_DB en .env}
      POSTGRES_USER: ${PG_USER:?Falta PG_USER en .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Falta PG_PASSWORD en .env}
    ports:
      # 5434 para no chocar con otros PostgreSQL locales (5432, 5433).
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    volumes:
      # Desde la imagen 18 los datos van en /var/lib/postgresql/18/docker:
      # se monta el directorio padre, no el viejo /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización solo escucha por socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
  postgres_data:
